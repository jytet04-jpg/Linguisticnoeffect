name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: 📥 Proje Dosyalarını Çek
        uses: actions/checkout@v4

      - name: ⚙️ Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Java Kurulumu (Android Build için)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 📦 Node Modüllerini Yükle
        run: |
          npm install
          npm install @capacitor/core @capacitor/filesystem @capacitor/share
          npm install -D @capacitor/cli @capacitor/android

      - name: 🏗️ React Uygulamasını Build Et
        run: npm run build

      - name: 📱 Capacitor Android Projesini Oluştur
        run: |
          echo '{ "appId": "com.offlineenglish.app", "appName": "Offline English", "webDir": "dist", "bundledWebRuntime": false }' > capacitor.config.json
          npx @capacitor/cli add android
          npx @capacitor/cli sync android

      - name: 🚀 APK (Android Uygulamasını) Derle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 📲 APK'yı İndirilebilir Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: OfflineEnglish-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
